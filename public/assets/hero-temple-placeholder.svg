<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER ASSET — hero background.
  Authored temple silhouette used until the real temple photograph is supplied.
  To replace: drop the photo at public/assets/hero-temple.jpg and update the
  hero-image CSS variable in src/styles/website.css (.hero-section).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A2233"/>
      <stop offset="55%" stop-color="#4B1420"/>
      <stop offset="100%" stop-color="#2A0B11"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8B963" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#B89146" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B89146" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0509"/>
      <stop offset="100%" stop-color="#0B0204"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="800" cy="414" r="380" fill="url(#halo)"/>

  <!-- Distant treeline -->
  <path d="M0 690 q60 -34 120 -6 q54 -40 118 -10 q66 -44 132 -8 q58 -34 116 -4 l0 240 L0 900 Z" fill="#150609" opacity="0.85"/>
  <path d="M1600 690 q-60 -34 -120 -6 q-54 -40 -118 -10 q-66 -44 -132 -8 q-58 -34 -116 -4 l0 240 L1600 900 Z" fill="#150609" opacity="0.85"/>

  <!-- Temple gopuram silhouette -->
  <g fill="url(#stone)">
    <rect x="620" y="600" width="360" height="300"/>
    <path d="M640 600 L800 300 L960 600 Z"/>
    <path d="M664 512 L800 258 L936 512 Z" opacity="0.92"/>
    <rect x="560" y="700" width="60" height="200"/>
    <rect x="980" y="700" width="60" height="200"/>
    <path d="M556 700 L590 622 L624 700 Z"/>
    <path d="M976 700 L1010 622 L1044 700 Z"/>
    <rect x="440" y="768" width="120" height="132"/>
    <rect x="1040" y="768" width="120" height="132"/>
  </g>

  <!-- Kalasam finial -->
  <g fill="#E8B963" opacity="0.9">
    <circle cx="800" cy="248" r="13"/>
    <rect x="796" y="196" width="8" height="46" rx="4"/>
    <circle cx="800" cy="190" r="8"/>
  </g>

  <!-- Sanctum doorway glow -->
  <path d="M762 900 L762 742 q38 -46 76 0 L838 900 Z" fill="#B89146" opacity="0.30"/>
  <path d="M776 900 L776 754 q24 -30 48 0 L824 900 Z" fill="#EBD9A9" opacity="0.22"/>

  <!-- Gold trim courses -->
  <g fill="#C79A4C" opacity="0.38">
    <rect x="620" y="596" width="360" height="5"/>
    <rect x="620" y="660" width="360" height="3"/>
    <rect x="440" y="764" width="720" height="3"/>
  </g>

  <!-- Lamp flames flanking the steps -->
  <g fill="#D9772B" opacity="0.55">
    <ellipse cx="600" cy="836" rx="9" ry="15"/>
    <ellipse cx="1000" cy="836" rx="9" ry="15"/>
  </g>
</svg>
